name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          if [ -f flutter-whatsapp-clone-master.zip ]; then
            unzip flutter-whatsapp-clone-master.zip
            shopt -s dotglob
            mv flutter-whatsapp-clone-master/* .
            rm -rf flutter-whatsapp-clone-master flutter-whatsapp-clone-master.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-alostora-apk
          path: build/app/outputs/flutter-apk/app-release.apk
